<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>TOTP 验证码</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>一次性验证码</h1>
      <div id="account" class="account">未配置账号</div>

      <label for="apiInput" class="label">后端接口</label>
      <div class="config-row">
        <input id="apiInput" type="url" placeholder="https://your-domain/totp" />
        <button id="saveBtn" type="button">保存</button>
      </div>
      <p id="apiHint" class="hint">首次使用请填写可访问的 /totp 地址，并保存。</p>

      <div class="code" id="code">------</div>

      <div class="meta">
        <div>剩余 <span id="ttl">--</span> 秒</div>
      </div>

      <div class="actions">
        <button id="refreshBtn">立即刷新</button>
        <button id="copyBtn">复制验证码</button>
      </div>

      <p id="status" class="status">点击“立即刷新”获取验证码</p>
    </section>
  </main>

  <script>
    const FALLBACK_APP_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'http://127.0.0.1:3000/totp'
      : '';
    const STORAGE_KEY = 'TOTP_API';
    const QUERY_KEY = 'api';

    const refreshBtn = document.getElementById('refreshBtn');
    const copyBtn = document.getElementById('copyBtn');
    const codeEl = document.getElementById('code');
    const ttlEl = document.getElementById('ttl');
    const statusEl = document.getElementById('status');
    const accountEl = document.getElementById('account');
    const apiInput = document.getElementById('apiInput');
    const saveBtn = document.getElementById('saveBtn');
    const apiHint = document.getElementById('apiHint');

    let timer = null;
    let currentExpireMs = 0;
    let isRefreshing = false;
    let APP_URL = getEndpoint();

    initEndpoint();

    function getEndpoint() {
      const queryUrl = new URLSearchParams(location.search).get(QUERY_KEY);
      if (queryUrl) return queryUrl;
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return saved;
      return FALLBACK_APP_URL;
    }

    function initEndpoint() {
      const queryUrl = new URLSearchParams(location.search).get(QUERY_KEY);
      if (queryUrl) {
        setEndpoint(queryUrl, false);
        return;
      }

      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        apiInput.value = saved;
      } else {
        apiInput.value = FALLBACK_APP_URL;
      }
    }

    function setEndpoint(url, persist) {
      const val = String(url || '').trim();
      APP_URL = val || FALLBACK_APP_URL;
      apiInput.value = APP_URL;
      apiHint.textContent = APP_URL
        ? `当前接口：${APP_URL}`
        : '请先填写后端 /totp 地址';
      if (persist) {
        localStorage.setItem(STORAGE_KEY, APP_URL);
      }
      if (location.protocol === 'https:' && APP_URL.startsWith('http://')) {
        apiHint.textContent = '当前页面为 HTTPS，后端不能是 http，请改为 https。';
      }
    }

    function setApiHint() {
      apiHint.textContent = APP_URL
        ? `当前接口：${APP_URL}`
        : '请先填写后端 /totp 地址';
    }

    function normalizeEndpoint(raw) {
      const value = String(raw || '').trim();
      if (!value) return FALLBACK_APP_URL;
      if (!/^https?:\/\//i.test(value)) return `https://${value}`;
      return value;
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function setCodeView(payload) {
      if (!payload || !payload.ok) {
        codeEl.textContent = '------';
        accountEl.textContent = '未配置账号';
        currentExpireMs = 0;
        setStatus(payload && payload.error ? `失败: ${payload.error}` : '获取失败');
        return;
      }

      codeEl.textContent = payload.code || '------';
      accountEl.textContent = payload.account || 'TOTP';
      currentExpireMs = Number(payload.expires_at || 0);
      setStatus('已刷新');
      tickTimer();
    }

    function tickTimer() {
      const now = Date.now();
      if (!currentExpireMs) {
        ttlEl.textContent = '--';
        return;
      }
      const left = Math.max(0, Math.floor((currentExpireMs - now) / 1000));
      ttlEl.textContent = pad(left);
      if (left <= 3 && left > 0) {
        setStatus(`验证码即将更新（${left} 秒）`);
      }
      if (left <= 0) {
        setStatus('已过期，自动刷新中...');
        if (!isRefreshing) refreshCode();
      }
    }

    async function refreshCode() {
      if (!APP_URL || !APP_URL.startsWith('http')) {
        setStatus('请先设置后端地址');
        return;
      }

      if (isRefreshing) return;
      isRefreshing = true;
      refreshBtn.disabled = true;
      copyBtn.disabled = true;
      setStatus('请求验证码中...');

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);

      try {
        const r = await fetch(APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'code' }),
          signal: controller.signal
        });

        if (!r.ok) {
          const text = await r.text().catch(() => '');
          throw new Error(`HTTP ${r.status} ${text}`.trim());
        }

        const payload = await r.json();
        setCodeView(payload);
        setApiHint();
      } catch (err) {
        setStatus('请求失败，请稍后重试');
      } finally {
        clearTimeout(timeout);
        isRefreshing = false;
        refreshBtn.disabled = false;
        copyBtn.disabled = false;
      }
    }

    async function copyCode() {
      const txt = codeEl.textContent.trim();
      if (!txt || txt === '------') return;
      try {
        await navigator.clipboard.writeText(txt);
        setStatus('已复制到剪贴板');
      } catch (_) {
        setStatus('复制失败，请手动复制');
      }
    }

    refreshBtn.addEventListener('click', refreshCode);
    copyBtn.addEventListener('click', copyCode);
    saveBtn.addEventListener('click', () => {
      setEndpoint(normalizeEndpoint(apiInput.value), true);
      refreshCode();
    });

    setEndpoint(APP_URL, !!localStorage.getItem(STORAGE_KEY));
    timer = setInterval(tickTimer, 1000);
    refreshCode();
  </script>
</body>
</html>
