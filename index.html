<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>验证码中心</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="同时查询邮箱验证码和 TOTP 一次性验证码" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div>
        <p class="eyebrow">VERIFICATION HUB</p>
        <h1>验证码中心</h1>
        <p class="intro">邮箱验证码与一次性验证码，集中查看、快速复制。</p>
      </div>
      <span id="healthBadge" class="health-badge" data-state="loading">正在连接</span>
    </header>

    <div class="code-grid">
      <section class="code-card totp-card" aria-labelledby="totpTitle">
        <div class="card-heading">
          <div>
            <p class="card-kicker">动态口令</p>
            <h2 id="totpTitle">一次性验证码</h2>
          </div>
          <span id="totpAccount" class="tag">TOTP</span>
        </div>

        <button id="totpCode" class="code-display" type="button" aria-label="复制一次性验证码" title="点击复制">------</button>
        <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
        <div class="code-meta">
          <span id="ttl">-- 秒后更新</span>
          <span>点击验证码即可复制</span>
        </div>

        <div class="card-actions">
          <button id="totpRefreshBtn" class="button primary" type="button">立即刷新</button>
          <button id="totpCopyBtn" class="button secondary" type="button">复制验证码</button>
        </div>
        <p id="totpStatus" class="status" role="status">正在连接 Apps Script…</p>
      </section>

      <section class="code-card email-card" aria-labelledby="emailTitle">
        <div class="card-heading">
          <div>
            <p class="card-kicker">邮件口令</p>
            <h2 id="emailTitle">邮箱验证码</h2>
          </div>
          <span class="tag">Gmail</span>
        </div>

        <div class="email-control">
          <label for="emailInput">Gmail 账号</label>
          <input id="emailInput" type="email" list="emailAccounts" placeholder="输入已配置的 Gmail 账号" autocomplete="email" />
          <datalist id="emailAccounts"></datalist>
        </div>

        <button id="emailCode" class="code-display compact" type="button" aria-label="复制邮箱验证码" title="点击复制">------</button>
        <div class="email-meta">
          <span id="emailReceived">尚未查询</span>
          <span id="emailSubject" class="subject"></span>
        </div>

        <div class="card-actions">
          <button id="emailSearchBtn" class="button primary" type="button">查询邮箱码</button>
          <button id="emailCopyBtn" class="button secondary" type="button">复制验证码</button>
        </div>
        <p id="emailStatus" class="status" role="status">输入邮箱后开始查询，最长等待 1 分钟</p>
      </section>
    </div>
  </main>

  <script>
    const TOTP_ENDPOINT = 'https://script.google.com/macros/s/AKfycbx7i4fZ34bzRT42XiXvO2vq4v8snfHwAtcSH0H-LUZPEUsmWF7TP7fxa9Ckmz80Qlw/exec';
    const EMAIL_ENDPOINTS = {
      'rubesubban@gmail.com': TOTP_ENDPOINT,
      'bubber7789121@gmail.com': 'https://script.google.com/macros/s/AKfycbygriDK5NQdlnx-uTi0rHUp4p4oyQit2h-aCQc0YjOsRXNKr5XBE-9Q3eYfgnZTV0p3/exec'
    };
    const GMAIL_SHARED_SECRET = '$ItG4@^7Kb1ZI5QPVfybRmDXL&A*uWY@GRatQf!s1evkSFml';

    const elements = {
      healthBadge: document.getElementById('healthBadge'),
      totpCode: document.getElementById('totpCode'),
      totpAccount: document.getElementById('totpAccount'),
      ttl: document.getElementById('ttl'),
      progressBar: document.getElementById('progressBar'),
      totpRefreshBtn: document.getElementById('totpRefreshBtn'),
      totpCopyBtn: document.getElementById('totpCopyBtn'),
      totpStatus: document.getElementById('totpStatus'),
      emailInput: document.getElementById('emailInput'),
      emailAccounts: document.getElementById('emailAccounts'),
      emailCode: document.getElementById('emailCode'),
      emailReceived: document.getElementById('emailReceived'),
      emailSubject: document.getElementById('emailSubject'),
      emailSearchBtn: document.getElementById('emailSearchBtn'),
      emailCopyBtn: document.getElementById('emailCopyBtn'),
      emailStatus: document.getElementById('emailStatus')
    };

    let totpExpiresAt = 0;
    let totpPeriod = 30;
    let serverClockOffset = 0;
    let totpRefreshing = false;
    let emailSearchToken = 0;
    let emailSearching = false;

    function fillEmailAccounts() {
      elements.emailAccounts.replaceChildren(...Object.keys(EMAIL_ENDPOINTS).map((email) => {
        const option = document.createElement('option');
        option.value = email;
        return option;
      }));
    }

    async function callScript(url, payload, timeoutMs = 30000) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, {
          method: payload ? 'POST' : 'GET',
          body: payload ? JSON.stringify(payload) : undefined,
          redirect: 'follow',
          signal: controller.signal
        });
        const text = await response.text();
        let result;
        try {
          result = JSON.parse(text);
        } catch {
          throw new Error('接口返回内容无法解析');
        }
        if (!response.ok || !result.ok) throw new Error(result.error || `HTTP ${response.status}`);
        return result;
      } catch (error) {
        if (error.name === 'AbortError') throw new Error('请求超时');
        throw error;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function checkHealth() {
      elements.healthBadge.dataset.state = 'loading';
      elements.healthBadge.textContent = '正在连接';
      try {
        const health = await callScript(TOTP_ENDPOINT, null, 10000);
        if (health.service !== 'gmail-and-totp' || !health.totp_configured) {
          throw new Error('Apps Script 配置不完整');
        }
        elements.healthBadge.dataset.state = 'ok';
        elements.healthBadge.textContent = 'Apps Script 已连接';
        return true;
      } catch (error) {
        elements.healthBadge.dataset.state = 'error';
        elements.healthBadge.textContent = '连接失败';
        elements.totpStatus.textContent = `连接失败：${error.message}`;
        return false;
      }
    }

    function setTotp(payload) {
      elements.totpCode.textContent = payload.code || '------';
      elements.totpAccount.textContent = payload.account || 'TOTP';
      totpExpiresAt = Number(payload.expires_at || 0);
      totpPeriod = Number(payload.period || 30);
      serverClockOffset = Date.now() - Number(payload.server_time || Date.now());
      elements.totpStatus.textContent = '验证码已同步';
      tickTotp();
    }

    async function refreshTotp() {
      if (totpRefreshing) return;
      totpRefreshing = true;
      elements.totpRefreshBtn.disabled = true;
      elements.totpStatus.textContent = '正在获取一次性验证码…';
      try {
        setTotp(await callScript(TOTP_ENDPOINT, { action: 'code' }, 15000));
        elements.healthBadge.dataset.state = 'ok';
        elements.healthBadge.textContent = 'Apps Script 已连接';
      } catch (error) {
        elements.totpStatus.textContent = `获取失败：${error.message}`;
        elements.healthBadge.dataset.state = 'error';
        elements.healthBadge.textContent = '连接失败';
      } finally {
        totpRefreshing = false;
        elements.totpRefreshBtn.disabled = false;
      }
    }

    function tickTotp() {
      if (!totpExpiresAt) {
        elements.ttl.textContent = '-- 秒后更新';
        elements.progressBar.style.width = '0%';
        return;
      }
      const serverNow = Date.now() - serverClockOffset;
      const remainingMs = Math.max(0, totpExpiresAt - serverNow);
      const seconds = Math.ceil(remainingMs / 1000);
      elements.ttl.textContent = `${seconds} 秒后更新`;
      elements.progressBar.style.width = `${Math.min(100, (remainingMs / (totpPeriod * 1000)) * 100)}%`;
      if (seconds <= 3 && seconds > 0) elements.totpStatus.textContent = `即将自动更新（${seconds} 秒）`;
      if (remainingMs <= 0 && !totpRefreshing) refreshTotp();
    }

    async function copyCode(element, statusElement) {
      const code = element.textContent.trim();
      if (!/^\d{6,10}$/.test(code)) return;
      try {
        await navigator.clipboard.writeText(code);
        statusElement.textContent = '验证码已复制';
      } catch {
        statusElement.textContent = '复制失败，请手动复制';
      }
    }

    async function fetchEmailCode(email) {
      const url = EMAIL_ENDPOINTS[email];
      if (!url) throw new Error('没有此邮箱');

      const verified = await callScript(url, {
        action: 'verify',
        secret: GMAIL_SHARED_SECRET
      }, 15000);

      return await callScript(url, {
        action: 'check',
        since_epoch: verified.since_epoch,
        window_sec: 120,
        secret: GMAIL_SHARED_SECRET
      }, 30000);
    }

    async function waitForNextAttempt(token, seconds) {
      for (let remaining = seconds; remaining > 0; remaining -= 1) {
        if (token !== emailSearchToken) return false;
        elements.emailStatus.textContent = `暂未收到，${remaining} 秒后重试…`;
        await new Promise((resolve) => setTimeout(resolve, 1000));
      }
      return token === emailSearchToken;
    }

    function finishEmailSearch() {
      emailSearching = false;
      elements.emailSearchBtn.textContent = '查询邮箱码';
      elements.emailSearchBtn.classList.remove('danger');
    }

    function stopEmailSearch() {
      emailSearchToken += 1;
      finishEmailSearch();
      elements.emailStatus.textContent = '已停止查询';
    }

    async function searchEmailCode() {
      if (emailSearching) return stopEmailSearch();
      const email = elements.emailInput.value.trim().toLowerCase();
      if (!email) {
        elements.emailStatus.textContent = '请输入邮箱地址';
        elements.emailInput.focus();
        return;
      }
      if (!EMAIL_ENDPOINTS[email]) {
        elements.emailStatus.textContent = '没有此邮箱';
        return;
      }

      const token = ++emailSearchToken;
      const deadline = Date.now() + 60000;
      emailSearching = true;
      elements.emailSearchBtn.textContent = '停止查询';
      elements.emailSearchBtn.classList.add('danger');
      elements.emailStatus.textContent = '正在查询最新邮件…';

      try {
        while (token === emailSearchToken && Date.now() < deadline) {
          const payload = await fetchEmailCode(email);
          if (payload.found && payload.payload) {
            const result = payload.payload;
            elements.emailCode.textContent = result.extracted || '------';
            elements.emailReceived.textContent = result.received_at
              ? `收到时间：${new Date(result.received_at * 1000).toLocaleString()}`
              : '已收到邮件';
            elements.emailSubject.textContent = result.subject || '';
            elements.emailStatus.textContent = '已找到最新邮箱验证码';
            finishEmailSearch();
            return;
          }
          if (!await waitForNextAttempt(token, 5)) return;
          elements.emailStatus.textContent = '正在重新查询…';
        }
        if (token === emailSearchToken) elements.emailStatus.textContent = '1 分钟内未查询到新验证码';
      } catch (error) {
        if (token === emailSearchToken) elements.emailStatus.textContent = `查询失败：${error.message}`;
      } finally {
        if (token === emailSearchToken) finishEmailSearch();
      }
    }

    elements.totpRefreshBtn.addEventListener('click', refreshTotp);
    elements.totpCopyBtn.addEventListener('click', () => copyCode(elements.totpCode, elements.totpStatus));
    elements.totpCode.addEventListener('click', () => copyCode(elements.totpCode, elements.totpStatus));
    elements.emailSearchBtn.addEventListener('click', searchEmailCode);
    elements.emailInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') searchEmailCode();
    });
    elements.emailCopyBtn.addEventListener('click', () => copyCode(elements.emailCode, elements.emailStatus));
    elements.emailCode.addEventListener('click', () => copyCode(elements.emailCode, elements.emailStatus));

    fillEmailAccounts();
    setInterval(tickTotp, 250);
    checkHealth().then(refreshTotp);
  </script>
</body>
</html>
